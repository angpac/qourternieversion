name: Qourt
options:
  bundleIdPrefix: net.criers
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 67YBGP3A84
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 42

targets:
  Qourt:
    type: application
    platform: iOS
    sources:
      - path: Qourt
      - path: QourtShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.criers.Qourt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Qourt/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Qourt uses the camera to scan a game's QR code so you can join instantly."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Qourt uses your location to suggest nearby courts and sports centers when creating a game."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Qourt/Qourt.entitlements
    dependencies:
      - target: "Qourt Watch App"
        embed: true
        codeSign: true
      - target: QourtWidgetExtension
        embed: true
        codeSign: true
      - package: Supabase
        product: Supabase

  QourtWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: QourtWidgetExtension
      - path: QourtShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.criers.Qourt.widget
        INFOPLIST_FILE: QourtWidgetExtension/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  "Qourt Watch App":
    type: application
    platform: watchOS
    sources:
      - path: "Qourt Watch App"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.criers.Qourt.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: 4
        SKIP_INSTALL: YES
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: net.criers.Qourt
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: "Qourt Watch App/Qourt Watch App.entitlements"
    dependencies:
      - package: Supabase
        product: Supabase

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

schemes:
  Qourt:
    build:
      targets:
        Qourt: all
    run:
      config: Debug
    archive:
      config: Release
  "Qourt Watch App":
    build:
      targets:
        "Qourt Watch App": all
    run:
      config: Debug
